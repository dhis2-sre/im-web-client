name: Playwright Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:
        inputs:
            api_url:
                description: "API URL target for the tests."
                type: string
                required: true

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    e2e:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            # Use the feature env API only when an im-manager pull request on the same branch deploys it, otherwise dev.
            - name: Resolve API URL
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
                      echo "API_URL=${{ inputs.api_url }}" >> $GITHUB_ENV
                      exit 0
                  fi
                  API_URL="https://api.im-dev.dhis2.org"
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      PAIRED=$(gh api "repos/dhis2-sre/im-manager/pulls?state=open&head=dhis2-sre:$GITHUB_HEAD_REF" \
                          --jq '[.[] | select(any(.labels[].name; . == "deploy"))] | length')
                      if [[ "$PAIRED" -gt 0 ]]; then
                          SLUG=${GITHUB_HEAD_REF,,}
                          SLUG=${SLUG//[^[:alnum:]]/-}
                          SLUG=${SLUG::25}
                          SLUG=${SLUG%-}
                          API_URL="https://${SLUG}.api.im-feat.dhis2.org"
                          timeout 10m bash -c "until curl -sf $API_URL/health; do sleep 10; done"
                      fi
                  fi
                  echo "API_URL=$API_URL" >> $GITHUB_ENV

            - name: Run Playwright tests
              run: make e2e-test
              env:
                  CI: true
                  REACT_APP_API_URL: ${{ env.API_URL }}
                  USER_EMAIL: ${{ secrets.IM_E2E_TEST_USER_EMAIL }}
                  USER_PASSWORD: ${{ secrets.IM_E2E_TEST_USER_PASSWORD }}
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
