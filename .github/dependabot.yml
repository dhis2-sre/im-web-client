version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      pull-request-branch-name:
          separator: "-"
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "daily"
      pull-request-branch-name:
          separator: "-"
      groups:
          react:
              patterns:
                  - "react"
                  - "react-dom"
                  - "@types/react"
                  - "@types/react-dom"
